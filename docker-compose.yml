# Single-server stack (local development or an office test server).
#   cp .env.example .env && docker compose up -d --build      → console http://localhost:8081
# For a LAN test server use deploy/install-lan.sh, which writes .env and sets WEB_BIND / PUBLIC_BASE_URL.
name: urban-crisis

x-core-build: &core-build
  context: ./services/core

x-core-env: &core-env
  APP_ENV: ${APP_ENV:-local}
  DATABASE_URL: postgres://crisis:${POSTGRES_PASSWORD:-local-only}@postgres:5432/crisis?sslmode=disable
  AUTH_MODE: dev
  DEV_JWT_SECRET: ${DEV_JWT_SECRET:?set DEV_JWT_SECRET in .env}
  MEDIA_URL_SECRET: ${MEDIA_URL_SECRET:?set MEDIA_URL_SECRET in .env}
  MEDIA_ALLOW_UNSCANNED: "true"
  EVENT_PUBLISHER: kafka
  KAFKA_BROKERS: kafka:9092
  # Media on a private volume; downloads use short-lived signed URLs served through the web proxy.
  OBJECT_STORE: fs
  OBJECT_STORE_DIR: /data/objects
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8081}
  CORS_ORIGINS: http://localhost:5173
  LOG_LEVEL: info

x-logging: &logging
  driver: json-file
  options: {max-size: "20m", max-file: "5"}

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: crisis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only}
      POSTGRES_DB: crisis
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crisis -d crisis"]
      interval: 5s
      retries: 30
    restart: unless-stopped
    logging: *logging

  kafka:
    image: apache/kafka:3.7.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1g
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      retries: 30
    restart: unless-stopped
    logging: *logging

  migrate:
    build: *core-build
    entrypoint: ["/app/migrate", "-seed"]
    environment: *core-env
    depends_on: {postgres: {condition: service_healthy}}
    restart: "no"

  api:
    build: *core-build
    entrypoint: ["/app/api"]
    environment: *core-env
    ports: ["127.0.0.1:8080:8080"]
    volumes: [objects:/data/objects]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "/app/api", "-healthcheck"]
      interval: 10s
      retries: 10
    restart: unless-stopped
    logging: *logging

  relay:
    build: *core-build
    entrypoint: ["/app/relay"]
    environment: *core-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}
    restart: unless-stopped
    logging: *logging

  notifier:
    build: *core-build
    entrypoint: ["/app/notifier"]
    environment: *core-env
    depends_on: {migrate: {condition: service_completed_successfully}}
    restart: unless-stopped
    logging: *logging

  consumer:
    build: *core-build
    entrypoint: ["/app/consumer"]
    environment: *core-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}
    restart: unless-stopped
    logging: *logging

  ai-worker:
    build:
      context: ./services/ai-assist
      args: {PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.org/simple}"}
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on: {kafka: {condition: service_healthy}}
    restart: unless-stopped
    logging: *logging

  web:
    build:
      context: ./apps/web-console
      args: {NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmjs.org/}"}
    ports: ["${WEB_BIND:-127.0.0.1:8081}:8080"]
    depends_on: {api: {condition: service_healthy}}
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  kafkadata:
  objects:
