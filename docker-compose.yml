# Local development stack. `depends_on` + healthchecks give readiness ordering, not just start order.
# Usage: cp .env.example .env && docker compose up --build   → console http://localhost:8081
name: urban-crisis

x-core-env: &core-env
  APP_ENV: ${APP_ENV:-local}
  DATABASE_URL: postgres://crisis:${POSTGRES_PASSWORD:-local-only}@postgres:5432/crisis?sslmode=disable
  AUTH_MODE: dev
  DEV_JWT_SECRET: ${DEV_JWT_SECRET:?set DEV_JWT_SECRET in .env}
  MEDIA_URL_SECRET: ${MEDIA_URL_SECRET:?set MEDIA_URL_SECRET in .env}
  MEDIA_ALLOW_UNSCANNED: "true"
  EVENT_PUBLISHER: kafka
  KAFKA_BROKERS: kafka:9092
  OBJECT_STORE: s3
  OBJECT_STORAGE_ENDPOINT: minio:9000
  OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-crisis}
  OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
  OBJECT_STORAGE_BUCKET: crisis-media
  CORS_ORIGINS: http://localhost:5173
  LOG_LEVEL: info

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: crisis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only}
      POSTGRES_DB: crisis
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crisis -d crisis"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.7.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-crisis}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports: ["127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  migrate:
    build: ./services/core
    entrypoint: ["/app/migrate", "-seed"]
    environment: *core-env
    depends_on: {postgres: {condition: service_healthy}}
    restart: "no"

  api:
    build: ./services/core
    entrypoint: ["/app/api"]
    environment: *core-env
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/app/api", "-healthcheck"]
      interval: 10s
      retries: 10

  relay:
    build: ./services/core
    entrypoint: ["/app/relay"]
    environment: *core-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}
    restart: unless-stopped

  notifier:
    build: ./services/core
    entrypoint: ["/app/notifier"]
    environment: *core-env
    depends_on: {migrate: {condition: service_completed_successfully}}
    restart: unless-stopped

  consumer:
    build: ./services/core
    entrypoint: ["/app/consumer"]
    environment: *core-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}
    restart: unless-stopped

  ai-worker:
    build: ./services/ai-assist
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on: {kafka: {condition: service_healthy}}
    restart: unless-stopped

  ai-api:
    build: ./services/ai-assist
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8000:8000"]

  web:
    build: ./apps/web-console
    ports: ["127.0.0.1:8081:8080"]
    depends_on: {api: {condition: service_healthy}}

volumes:
  pgdata:
  miniodata:
