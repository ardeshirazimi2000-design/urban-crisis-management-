# Builds the citizen and responder APKs and attaches them to the run (Actions › this run › Artifacts).
# Run it from the Actions tab ("Run workflow"), or push a tag such as apk-2026-10-14 to build with the
# repository variable APK_API_BASE_URL (Settings › Secrets and variables › Actions › Variables).
name: build-apk
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API address, e.g. https://crisis.example.ir/api/v1"
        required: true
      dev_auth:
        description: "Test server sign-in (/dev/token) instead of Shahkar + SMS code"
        type: boolean
        default: false
  push:
    tags: ["apk-*"]
permissions: {contents: read}

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ inputs.api_base_url || vars.APK_API_BASE_URL }}
      DEV_AUTH: ${{ inputs.dev_auth && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: "3.24.5", channel: stable}
      - name: check the API address
        run: |
          case "$API_BASE_URL" in
            https://*/api/v1) ;;
            http://*/api/v1) [ "$DEV_AUTH" = true ] || { echo "Production builds need an https:// address"; exit 1; } ;;
            *) echo "API_BASE_URL must look like https://<domain>/api/v1 (got '$API_BASE_URL')"; exit 1 ;;
          esac
      - name: citizen app
        working-directory: apps/mobile-citizen
        run: |
          [ "$DEV_AUTH" = true ] && export ALLOW_CLEARTEXT=true
          flutter pub get
          flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL" --dart-define=DEV_AUTH="$DEV_AUTH"
          cp build/app/outputs/flutter-apk/app-release.apk ../../crisis-citizen.apk
      - name: responder app
        working-directory: apps/mobile-responder
        run: |
          [ "$DEV_AUTH" = true ] && export ALLOW_CLEARTEXT=true
          flutter pub get
          flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL" --dart-define=DEV_AUTH="$DEV_AUTH"
          cp build/app/outputs/flutter-apk/app-release.apk ../../crisis-responder.apk
      - uses: actions/upload-artifact@v4
        with:
          name: crisis-apks
          path: |
            crisis-citizen.apk
            crisis-responder.apk
          retention-days: 14
