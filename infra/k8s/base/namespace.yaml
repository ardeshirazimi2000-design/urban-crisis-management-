apiVersion: v1
kind: Namespace
metadata:
  name: crisis
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: crisis-quota, namespace: crisis}
spec:
  hard: {requests.cpu: "24", requests.memory: 48Gi, limits.cpu: "48", limits.memory: 96Gi, pods: "120"}
---
apiVersion: v1
kind: LimitRange
metadata: {name: defaults, namespace: crisis}
spec:
  limits:
    - type: Container
      default: {cpu: 500m, memory: 512Mi}
      defaultRequest: {cpu: 100m, memory: 128Mi}
