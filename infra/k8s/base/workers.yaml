apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: crisis
  labels: {app.kubernetes.io/name: relay, app.kubernetes.io/part-of: urban-crisis}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app.kubernetes.io/name: relay}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: relay, app.kubernetes.io/part-of: urban-crisis}
      annotations: {prometheus.io/scrape: "false", prometheus.io/port: "8080"}
    spec:
      serviceAccountName: core
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app.kubernetes.io/name: relay}}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: {matchLabels: {app.kubernetes.io/name: relay}}
      containers:
        - name: relay
          # Pin by digest in release overlays (immutable images).
          image: registry.example.invalid/crisis/core:1.0.0
          command: ["/app/relay"]
          envFrom:
            - configMapRef: {name: core-config}
            - secretRef: {name: core-secrets}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
