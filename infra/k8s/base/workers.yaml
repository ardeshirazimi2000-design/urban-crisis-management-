              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: {matchLabels: {app.kubernetes.io/name: ai-worker}}
      containers:
        - name: ai-worker
          # Pin by digest in release overlays (immutable images).
          image: registry.example.invalid/crisis/ai-assist:1.0.0
          command: ["python", "-m", "app.worker"]
          envFrom:
            - configMapRef: {name: core-config}
          env: [{name: AI_MAX_CONCURRENCY, value: "4"}]
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
# Kafka consumers must scale on consumer lag and downstream capacity, not CPU alone (doc §11).
# Use KEDA (kafka scaler) in clusters that run it; partitions bound useful replicas.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: workers, namespace: crisis}
spec:
  maxUnavailable: 1
  selector: {matchExpressions: [{key: app.kubernetes.io/name, operator: In, values: [relay, notifier, consumer, ai-worker]}]}
