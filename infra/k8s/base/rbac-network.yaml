apiVersion: v1
kind: ServiceAccount
metadata: {name: core, namespace: crisis}
automountServiceAccountToken: false
---
# Default deny; then allow only what each workload needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: crisis}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-dns, namespace: crisis}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ingress-to-web-api, namespace: crisis}
spec:
  podSelector: {matchExpressions: [{key: app.kubernetes.io/name, operator: In, values: [api, web]}]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: core-egress, namespace: crisis}
spec:
  podSelector: {matchExpressions: [{key: app.kubernetes.io/name, operator: In, values: [api, relay, notifier, consumer, ai-worker]}]}
  policyTypes: [Egress]
  egress:
    # PostgreSQL, Kafka, object storage and the OIDC issuer live outside this namespace; narrow these CIDRs per site.
    - ports: [{protocol: TCP, port: 5432}, {protocol: TCP, port: 9092}, {protocol: TCP, port: 443}, {protocol: TCP, port: 9000}]
