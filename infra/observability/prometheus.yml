global: {scrape_interval: 15s, evaluation_interval: 30s}
rule_files: [alerts.yml]
scrape_configs:
  - job_name: crisis-api
    kubernetes_sd_configs: [{role: pod, namespaces: {names: [crisis]}}]
    relabel_configs:
      - {source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape], action: keep, regex: "true"}
      - {source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name], target_label: app}
  - job_name: synthetic-probe
    metrics_path: /probe
    params: {module: [http_2xx]}
    static_configs: [{targets: ["https://crisis.example.invalid/health/ready"]}]
