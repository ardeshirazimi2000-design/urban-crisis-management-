name: crisis_citizen
description: Urban crisis management — citizen app (Persian, RTL, offline-first).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crisis_core:
    path: ../mobile-shared
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4
  geolocator: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  http: ^1.2.2

flutter:
  uses-material-design: true
