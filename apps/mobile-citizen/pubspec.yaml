name: crisis_citizen
description: Urban crisis management — citizen app (Persian, RTL, offline-first).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crisis_core:
    path: ../mobile-shared
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4
  geolocator: ^13.0.1
  url_launcher: ^6.3.0

# geolocator_android 4.6.2 uses build properties that need a newer Flutter than 3.24 despite its constraints.
dependency_overrides:
  geolocator_android: 4.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  http: ^1.2.2

flutter:
  uses-material-design: true
  assets:
    # Approved guidance bundled for offline use; identical to services/core/seeds/guidance.fa.json (tested).
    - assets/guidance.fa.json
