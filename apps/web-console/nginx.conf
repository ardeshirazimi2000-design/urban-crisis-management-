server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;

  # Same-origin API through the gateway (avoids CORS and token leakage to third parties).
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Correlation-ID $http_x_correlation_id;
    client_max_body_size 12m;
  }
  location / {
    try_files $uri /index.html;
  }
}
