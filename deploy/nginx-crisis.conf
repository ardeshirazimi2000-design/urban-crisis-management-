# Host reverse proxy for the production console and API (TLS 1.2 only, AFTA FCS_TLSS_EXT.1 cipher suites).
# Install: sudo cp deploy/nginx-crisis.conf /etc/nginx/sites-available/crisis && edit server_name and certificate paths,
#          sudo ln -sf /etc/nginx/sites-available/crisis /etc/nginx/sites-enabled/crisis && sudo nginx -t && sudo systemctl reload nginx
# The console container listens on 127.0.0.1:8081 (WEB_BIND) and the API trusts two proxy hops (TRUSTED_PROXY_HOPS=2).

server {
    listen 443 ssl http2;   # nginx 1.24 (Ubuntu 24.04) syntax
    server_name crisis.example.ir;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/crisis.example.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crisis.example.ir/privkey.pem;
    ssl_protocols TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_ecdh_curve prime256v1:secp384r1;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 60s;
    }
}

# Plain HTTP only redirects (and serves Let's Encrypt challenges if the webroot method is used).
server {
    listen 80;
    server_name crisis.example.ir;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
